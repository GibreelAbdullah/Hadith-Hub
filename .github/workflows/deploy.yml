name: Deploy to GitHub Pages

on:
  push:
    branches: [next]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          BASE_PATH: '/Hadith-Hub'
          VITE_DB_BASE_URL: 'https://raw.githubusercontent.com/GibreelAbdullah/hadith-db/refs/heads/master/data'
          VITE_PAGEFIND_URL: 'https://gibreelabdullah.github.io/hadith-db'
        run: npm run build

      - name: Fix SPA routing for GitHub Pages
        run: |
          cp build/index.html build/404.html
          # Add .nojekyll to prevent GitHub Pages from ignoring files starting with _
          touch build/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
