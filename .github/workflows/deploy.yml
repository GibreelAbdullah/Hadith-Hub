name: Deploy to GitHub Pages

on:
  push:
    branches: [prod]
  repository_dispatch:
    types: [hadith-db-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          VITE_DB_BASE_URL: 'https://gibreelabdullah.github.io/hadith-db/data'
          VITE_META_BASE_URL: '/db'
        run: npm run build

      - name: Clone hadith-db data for search index
        run: |
          git clone --depth 1 https://github.com/GibreelAbdullah/hadith-db.git /tmp/hadith-db
          rm -rf static/db
          cp -r /tmp/hadith-db/data static/db

      - name: Cache pagefind index
        id: pagefind-cache
        uses: actions/cache@v4
        with:
          path: |
            build/pagefind
          key: pagefind-${{ hashFiles('static/db/books/**/*.txt') }}
          restore-keys: |
            pagefind-

      - name: Copy metadata and muhaddith to build output
        run: |
          mkdir -p build/db
          cp static/db/collections.json build/db/
          cp static/db/gradeTranslations.json build/db/
          # Copy book metadata
          for dir in static/db/books/*/; do
            coll=$(basename "$dir")
            if [ -f "$dir/metadata.json" ]; then
              mkdir -p "build/db/books/$coll"
              cp "$dir/metadata.json" "build/db/books/$coll/"
            fi
          done
          # Copy muhaddith data
          if [ -d "static/db/muhaddith" ]; then
            cp -r static/db/muhaddith build/db/muhaddith
          fi

      - name: Build search index
        if: steps.pagefind-cache.outputs.cache-hit != 'true'
        run: node build_search_index.mjs

      - name: Generate blog meta pages (OG tags for social media previews)
        run: node generate_blog_meta.mjs --data-dir static/db --output-dir build --base-url https://hadithhub.com

      - name: Fix SPA routing for GitHub Pages
        run: |
          cp build/index.html build/404.html
          echo "hadithhub.com" > build/CNAME
          touch build/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
